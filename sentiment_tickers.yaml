# sentiment_tickers.yaml
# Candidate Bloomberg symbology for the HSBC-style sentiment indicator.
#
# STATUS: every ticker below is a CANDIDATE, not a confirmed symbol. Bloomberg
# symbology for survey, CFTC and flow series is not reliably documented outside
# the Terminal, so each input carries a ranked candidate list. Run
# diagnose_sentiment.py on the Windows Terminal machine to resolve which
# candidates exist, carry sufficient history, and are entitled on your licence.
# The diagnostic writes back a resolved map you can promote into this file.
#
# Reference: HSBC Global Research, "Sentiment shape up - Our revamped sentiment
# indicators", Multi-Asset Global, 5 March 2024.
#
# British spelling used throughout. No behavioural code lives here; this file is
# pure configuration, consistent with the provider-isolation principle used by
# the rest of the House View dashboard.

meta:
  version: "0.2-round1-resolved"
  created: "2026-08-11"
  diagnostic_run: "2026-08-11 17:25, Windows Terminal"
  hsbc_source: "Sentiment shape up, HSBC Multi-Asset Global, 5 March 2024"
  sell_input_count_published: 20   # inferred by counting, not stated by HSBC
  buy_input_count_published: 13    # inferred by counting, not stated by HSBC

  # Round 1 outcome. Tickers marked CONFIRMED below returned usable history on
  # the Terminal. Every failure was INVALID_TICKER rather than FIELD_DENIED,
  # which means the gaps are symbology problems, not entitlement problems.
  round1:
    buildable: 13
    partial: 5
    blocked: 3
    usable_after_degradation: 16   # 13 buildable + capca, sentiment proxy, survey average running on partial legs
    effective_sell_denominator: 15  # of 20 published
    effective_buy_denominator: 10   # of 13 published
    empty_clusters: [flows, fx_beta]
    surprises:
      - "SHORT_INT is entitled: inputs 5 and 6 resolved with semi-monthly history to 2004."
      - "FUND_NET_ASSET_VAL is entitled: inputs 2 and 3 resolved with full daily history."
      - "MOVE Index is entitled, 5808 observations from 2004-01-01."
      - "NAAIMEXP Index resolved, weekly from 2006-07-05."
    outstanding:
      - "CTA index: all candidates invalid. See sentiment_tickers_round2.yaml."
      - "Money market flows 21: all ICI candidates invalid."
      - "CAPCA UST leg: futures put/call fields return no history."
      - "Investors Intelligence: all candidates invalid, paid feed."
    corrected:
      - >
        CFTC 17 and 18 were not a symbology problem. Bloomberg exposes COT via
        the BQL functions cot_position() and cot_traders() behind //blp/bqlsvc,
        not as tickers on //blp/refdata, so no ticker guess could ever have
        worked. Terminal function is COT <GO>, not CFTC <GO>. See
        diagnose_bql.py. This means the provider needs two Bloomberg services.

  # Second data path, introduced by the COT/BQL discovery.
  services:
    refdata:
      service: "//blp/refdata"
      covers: "the 16 ticker-based inputs, via HistoricalDataRequest on PX_LAST and friends"
    bql:
      service: "//blp/bqlsvc"
      covers: "inputs 17 and 18, via cot_position() and cot_traders()"
      availability: UNVERIFIED
      note: >
        BQL is documented for BQuant and B-PIPE; Desktop API access exists but
        is not universal. diagnose_bql.py rung 0.1 answers this before anything
        else is attempted. If the service will not open, COT falls back to the
        free CFTC Commitments of Traders CSV.

  # Effective history start per input, driven by the shortest confirmed series.
  # Matters because expanding-window percentiles are unstable early.
  effective_starts:
    vix_hy_vix_ig: "2007-04-11"   # HYG 3MO_CALL_IMP_VOL
    mask: "2004-08-27"            # TLT 3MO_CALL_IMP_VOL
    average_survey_sentiment: "2006-07-05"  # NAAIMEXP
    short_interest_equity_bond_etfs: "2007-04-13"  # HYG SHORT_INT

# ---------------------------------------------------------------------------
# Global request defaults. These mirror the conventions already used by
# blpapi_provider.py so the sentiment provider can share helpers.
# ---------------------------------------------------------------------------
defaults:
  field: PX_LAST
  periodicity: DAILY
  # History start. 2004 gives ~20y, enough for expanding-window percentiles to
  # stabilise and to include 2007-09, which the improved variant deliberately
  # keeps rather than filters out.
  history_start: "2004-01-01"
  # Minimum acceptable history before an input is allowed into the aggregate.
  min_history_years: 5
  # An input whose last observation is older than this is treated as stale and
  # excluded from the live reading rather than silently carried forward.
  max_staleness_days:
    daily: 7
    weekly: 21
    monthly: 60
  non_trading_day_fill_option: NON_TRADING_WEEKDAYS
  non_trading_day_fill_method: PREVIOUS_VALUE

# ---------------------------------------------------------------------------
# Strength bands, as published.
# ---------------------------------------------------------------------------
bands:
  - {name: "No signal", lo: 0.00, hi: 0.20}
  - {name: "Mild",      lo: 0.20, hi: 0.30}
  - {name: "Moderate",  lo: 0.30, hi: 0.40}
  - {name: "Strong",    lo: 0.40, hi: 0.50}
  - {name: "Extreme",   lo: 0.50, hi: 1.01}

# ---------------------------------------------------------------------------
# Engine settings. Both aggregation modes run in parallel off identical inputs.
# ---------------------------------------------------------------------------
engine:
  modes:
    replica:
      # Faithful HSBC: binary firing, equal-weighted count, crisis filtering on.
      aggregation: binary_count
      apply_crisis_filters: true
      weighting: equal
    improved:
      # Tier-1 fixes: continuous signal, robust scaling, crisis data retained,
      # correlation clustering to stop redundant inputs dominating the count.
      aggregation: continuous_zscore
      apply_crisis_filters: false
      robust_scaling: median_mad
      winsorise_at: 3.0
      weighting: correlation_cluster
      cluster_corr_threshold: 0.70
      # Trend overlay (Tier 2 #6): gate sell signals on trend state. Off by
      # default so the two modes stay comparable until you switch it on.
      trend_overlay:
        enabled: false
        gate_ticker: "SPX Index"
        gate_rule: "below_200dma"
        applies_to: [sell]
  # Difference horizons are undefined in the HSBC report. We pin them to
  # calendar months and expose the trading-day alternative for sensitivity work.
  diff_horizon_convention: calendar   # calendar | trading
  # Smoothing order is likewise undefined. Pinned explicitly.
  smoothing_order: smooth_then_diff   # smooth_then_diff | diff_then_smooth
  # Release-lag discipline (Tier 3 #11): each input is stamped at its true
  # public-availability date, not its as-of date.
  apply_release_lags: true

# ---------------------------------------------------------------------------
# The 21 inputs.
#
# kind:
#   direct   - a single Bloomberg series is the input
#   derived  - computed from two or more Bloomberg series
#   proxy    - HSBC's input is proprietary; this is a documented substitute
#
# availability_hsbc mirrors the assessment in the methodology note.
# ---------------------------------------------------------------------------
inputs:

  - id: cta_equity_beta
    hsbc_ref: 1
    name: "CTA equity beta"
    kind: derived
    availability_hsbc: semi_proprietary
    compute: {op: rolling_beta, window_days: 20, post: {op: diff, horizon: 3M}}
    sell: {rule: gt, pct: 90, window: expanding}
    buy:  {rule: lt, pct: 10, window: expanding}
    status: UNRESOLVED
    series:
      - role: dependent
        # ROUND 1: NEIXCTA, NEIXCTAT, SGCTAI all INVALID_TICKER.
        # BTOPCTA resolved but is dead: last observation 2005-12-30.
        candidates: []
        pending: "sentiment_tickers_round2.yaml -> cta_index_hunt_daily, cta_fund_basket, cta_synthetic_trend"
      - role: factor
        candidates: ["SPX Index"]   # CONFIRMED, 5687 obs from 2004-01-02
    notes: >
      The CTA index is the single biggest unresolved item. Round 2 tests three
      routes: daily investable CTA indices, a managed-futures fund NAV basket
      (viable now that FUND_NET_ASSET_VAL is confirmed entitled), and a
      synthetic vol-scaled trend signal computed from SPX alone. The third
      always works, so this input is recoverable in the worst case, but at
      reduced fidelity. Do not ship it silently as "CTA beta" if the synthetic
      route is used; label it as a trend proxy in the UI.

  - id: us_equity_fund_beta
    hsbc_ref: 2
    name: "US equity fund beta"
    kind: proxy
    availability_hsbc: paywalled
    compute: {op: rolling_beta, window_days: 20, post: {op: diff, horizon: 3M}}
    sell: {rule: gt, pct: 90, window: expanding}
    buy: null
    series:
      - role: dependent_basket
        weight_field: FUND_TOTAL_ASSETS
        price_field: FUND_NET_ASSET_VAL
        candidates:
          - "AGTHX US Equity"
          - "FCNTX US Equity"
          - "TRBCX US Equity"
          - "AIVSX US Equity"
          - "DODGX US Equity"
      - role: factor
        candidates: ["SPX Index"]
    notes: >
      HSBC aggregates the full US equity fund universe by AuM-weighted daily NAV.
      This proxy uses a fixed basket of large active funds. It is survivorship-
      biased by construction (Tier 3 #12); treat as directionally indicative.
      FUND_NET_ASSET_VAL history depth and entitlement both need checking.

  - id: us_multi_asset_fund_equity_beta
    hsbc_ref: 3
    name: "US multi-asset fund equity beta"
    kind: proxy
    availability_hsbc: paywalled
    compute: {op: rolling_beta, window_days: 20, post: {op: diff, horizon: 3M}}
    sell: {rule: gt, pct: 90, window: expanding}
    buy:  {rule: lt, pct: 10, window: expanding}
    series:
      - role: dependent_basket
        weight_field: FUND_TOTAL_ASSETS
        price_field: FUND_NET_ASSET_VAL
        candidates:
          - "ABALX US Equity"
          - "AMECX US Equity"
          - "VBIAX US Equity"
          - "PRWCX US Equity"
          - "DODBX US Equity"
      - role: factor
        candidates: ["SPX Index"]
    notes: >
      Same caveats as us_equity_fund_beta. Near-collinear with it and with
      cta_equity_beta; the improved mode clusters all three.

  - id: cta_usd_beta
    hsbc_ref: 4
    name: "CTA USD beta"
    kind: derived
    availability_hsbc: semi_proprietary
    compute: {op: rolling_beta, window_days: 20, post: {op: level}}
    sell: {rule: gt, pct: 80, window: {rolling_years: 1}}
    buy: null
    status: UNRESOLVED
    series:
      - role: dependent
        candidates: []   # ROUND 1: all CTA candidates INVALID_TICKER
        pending: "sentiment_tickers_round2.yaml -> same three routes as cta_equity_beta"
      - role: factor
        candidates: ["DXY Curncy", "BBDXY Index"]  # both CONFIRMED
    notes: >
      Shares a dependent series with cta_equity_beta, so both are resolved or
      blocked together. This is the sole member of the fx_beta cluster, which is
      therefore currently empty.

  - id: short_interest_equity_etfs
    hsbc_ref: 5
    name: "Short interest, large equity ETFs"
    kind: direct
    availability_hsbc: paywalled
    field: SHORT_INT
    field_alternates: ["EQY_SHORT_INTEREST", "SI_PERCENT_EQY_FLOAT"]
    compute: {op: diff, horizon: 3M, smooth: {op: rolling_mean, months: 1}}
    sell: {rule: lt, pct: 10, window: {rolling_years: 5}}
    buy: null
    series:
      - role: basket
        candidates: ["SPY US Equity", "QQQ US Equity", "IWM US Equity", "VTI US Equity", "IVV US Equity"]
    notes: >
      HSBC screens for equity ETFs with AuM >= $20bn, applied as of today across
      all history, which is survivorship bias. This basket is a fixed
      approximation. Short interest is bi-weekly at source (FINRA) and is a
      separately entitled Bloomberg dataset; expect this input to fail the
      diagnostic on a standard licence.

  - id: short_interest_equity_bond_etfs
    hsbc_ref: 6
    name: "Short interest, equity and bond ETFs"
    kind: direct
    availability_hsbc: paywalled
    field: SHORT_INT
    field_alternates: ["EQY_SHORT_INTEREST"]
    compute: {op: diff, horizon: 12M, smooth: {op: rolling_mean, months: 1}}
    sell: {rule: lt, pct: 10, window: {rolling_years: 5}}
    buy: null
    series:
      - role: basket
        candidates:
          - "SPY US Equity"
          - "QQQ US Equity"
          - "IWM US Equity"
          - "LQD US Equity"
          - "HYG US Equity"
          - "TLT US Equity"
          - "AGG US Equity"
          - "BND US Equity"
    notes: "Bond ETF screen is AuM >= $7.5bn in the HSBC note."

  - id: risk_parity_equity_allocation
    hsbc_ref: 7
    name: "Risk parity equity allocation"
    kind: derived
    availability_hsbc: computable
    compute:
      op: inverse_vol_allocation
      vol_window_days: 60
      target_sleeve: equity
      post: {op: diff, horizon: 3M}
    sell: {rule: gt, pct: 90, window: expanding}
    buy:  {rule: lt, pct: 10, window: expanding}
    series:
      - role: sleeve_equity
        candidates: ["SPX Index"]
      - role: sleeve_rates
        candidates: ["LUATTRUU Index", "IEF US Equity"]
      - role: sleeve_credit
        candidates: ["LF98TRUU Index", "HYG US Equity"]
      - role: sleeve_commodity
        candidates: ["BCOMTR Index", "BCOM Index"]
    notes: >
      HSBC also lists a 6M difference variant. Both are computed; the config
      pins 3M as headline and 6M is available for sensitivity work.

  - id: vol_target_equity_allocation
    hsbc_ref: 8
    name: "Vol-target equity allocation"
    kind: derived
    availability_hsbc: computable
    compute:
      op: vol_target_allocation
      target_vol: 0.10
      vol_window_days: 60
      post: {op: diff, horizon: 6M}
    sell: {rule: gt, pct: 90, window: expanding}
    buy:  {rule: lt, pct: 20, window: expanding}
    series:
      - role: underlying
        candidates: ["SPX Index"]

  - id: equity_momentum_indicator
    hsbc_ref: 9
    name: "Equity momentum / positioning indicator"
    kind: proxy
    availability_hsbc: proprietary
    compute: {op: zscore_composite, window_days: 252}
    sell: {rule: gt, pct: 80, window: {rolling_years: 5}}
    buy:  {rule: lt, pct: 10, window: {rolling_years: 5}}
    series:
      - role: futures_price
        candidates: ["ES1 Index", "SPX Index"]
      - role: open_interest
        field: OPEN_INT
        candidates: ["ES1 Index"]
    notes: >
      HSBC's own positioning model, undisclosed ("same methodology as our FX
      positioning indicators", 2013) and scaled -10 to +10. This is a
      trend-and-open-interest substitute, not a replication. Flag it in the UI
      as a substitute so the aggregate is not read as a clone.

  - id: capca
    hsbc_ref: 10
    name: "CAPCA (cross-asset put-call)"
    kind: derived
    availability_hsbc: partly_public
    compute: {op: mean_of_zscores, post: {op: diff, horizon: 3M}}
    sell: {rule: gt, pct: 90, window: {rolling_years: 5}}
    buy:  {rule: lt, pct: 10, window: {rolling_years: 5}}
    status: PARTIAL
    degraded_mode: equity_only
    series:
      - role: equity_put_call
        # CONFIRMED: PCRTEQTY 5694 obs from 2004-01-02. PCUSEQTR and PCRTTOTL
        # also resolved; PCC Index invalid.
        candidates: ["PCRTEQTY Index", "PCUSEQTR Index", "PCRTTOTL Index"]
      - role: ust_put_call
        # ROUND 1: TY1 and TYA resolved as securities but the put/call fields
        # returned no observations. Futures chains are the wrong route.
        optional: true
        candidates: []
        pending: "sentiment_tickers_round2.yaml -> capca_ust_leg_hunt"
    notes: >
      Equity leg is public (Cboe). UST leg is the weak point: HSBC does not
      specify which Treasury option chain or which ratio. The candidates use
      the front 10y future's option put-call ratio as the closest available
      stand-in. Composite weights are undisclosed; equal-weight z-scores
      assumed and that assumption is surfaced in the UI.

  - id: mask
    hsbc_ref: 11
    name: "MASK (multi-asset skew)"
    kind: derived
    availability_hsbc: partly_public
    compute:
      op: mean_of_zscores
      smooth: {op: rolling_mean, months: 1}
      post: {op: diff, horizon: 3M}
    crisis_filter: ["2020"]
    sell: {rule: lt, pct: 10, window: expanding}
    buy:  {rule: gt, pct: 90, window: expanding}
    series:
      - role: equity_skew
        candidates: ["SKEW Index"]   # CONFIRMED, 5683 obs from 2004-01-02
      - role: ust_skew
        field: 3MO_CALL_IMP_VOL
        field_alternates: ["3MO_PUT_IMP_VOL"]
        # CONFIRMED via TLT, 5495 obs from 2004-08-27. TY1 returned no data,
        # so the ETF route is the working one and is now first.
        candidates: ["TLT US Equity", "IEF US Equity"]
    notes: >
      Equity leg is clean (Cboe SKEW). UST skew is not published as an index;
      the candidate approach derives a crude 25-delta proxy from call and put
      implied vols. Expect meaningful divergence from HSBC here.

  - id: vix_curve
    hsbc_ref: 12
    name: "VIX curve (VIX3M / VIX)"
    kind: derived
    availability_hsbc: public
    compute:
      op: ratio
      smooth: {op: rolling_mean, months: 3}
      post: {op: diff, horizon: 1M}
    crisis_filter: ["2020"]
    sell: {rule: gt, pct: 90, window: {rolling_years: 5}}
    buy:  {rule: lt, pct: 10, window: {rolling_years: 5}}
    series:
      - role: numerator
        candidates: ["VIX3M Index", "VXV Index"]
      - role: denominator
        candidates: ["VIX Index"]
    notes: >
      VIX3M was renamed from VXV; older Bloomberg installs may still resolve
      only VXV. Both candidates are tested and the diagnostic reports which
      carries the longer history.

  - id: vix_hy_vix_ig
    hsbc_ref: 13
    name: "VIX HY / VIX IG"
    kind: derived
    availability_hsbc: limited
    compute: {op: ratio, post: {op: level}}
    sell: null
    buy:  {rule: gt, pct: 90, window: expanding}
    series:
      - role: numerator
        field: 3MO_CALL_IMP_VOL
        # CONFIRMED via HYG, 4803 obs from 2007-04-11. VXHYG returned no data.
        candidates: ["HYG US Equity"]
      - role: denominator
        field: 3MO_CALL_IMP_VOL
        # CONFIRMED via LQD, 5472 obs from 2004-09-22. VXIGX invalid.
        candidates: ["LQD US Equity"]
    notes: >
      The Cboe ETF volatility indices are gone, as suspected, and the ETF
      implied-vol fallback carried it. Effective start is 2007-04-11, set by
      HYG's launch, so this input has three fewer years of history than the
      rest. Its expanding-window percentile is therefore computed on a shorter
      sample and should not be read as comparable to the pre-2007 inputs.

  - id: move
    hsbc_ref: 14
    name: "MOVE index"
    kind: direct
    availability_hsbc: public_licensed
    compute: {op: diff, horizon: 3M, smooth: {op: rolling_mean, months: 1}}
    crisis_filter: ["2007-2009", "2020"]
    sell: {rule: lt, pct: 10, window: expanding}
    buy: null
    series:
      - role: primary
        candidates: ["MOVE Index"]
    notes: >
      MOVE is ICE-owned and separately licensed on some Bloomberg contracts.
      Worth confirming entitlement explicitly rather than assuming.

  - id: risk_appetite_pc1
    hsbc_ref: 15
    name: "Risk appetite (first principal component, risk-on vs risk-off)"
    kind: derived
    availability_hsbc: computable
    compute: {op: pca_first_component, window_days: 252, post: {op: diff, horizon: 6M}}
    crisis_filter: ["2020-2021"]
    sell: {rule: gt, pct: 90, window: {rolling_years: 3}}
    buy: null
    series:
      - role: basket
        candidates:
          - "SPX Index"
          - "LUATTRUU Index"
          - "LF98TRUU Index"
          - "BCOMTR Index"
          - "XAU Curncy"
          - "AUDJPY Curncy"
          - "VIX Index"
    notes: >
      HSBC names the constituents only loosely ("risk-on vs risk-off
      performances across asset classes"). This basket is a reasonable reading
      of that description, not a disclosed list.

  - id: cross_asset_rsi
    hsbc_ref: 16
    name: "Cross-asset RSI"
    kind: derived
    availability_hsbc: computable
    compute:
      op: mean_rsi
      rsi_window_days: 14
      smooth: {op: rolling_mean, months: 1}
      post: {op: diff, horizon: 12M}
    sell: {rule: gt, pct: 90, window: {rolling_years: 1}}
    buy: null
    series:
      - role: basket
        candidates:
          - "SPX Index"
          - "LUATTRUU Index"
          - "LF98TRUU Index"
          - "BCOMTR Index"
          - "DXY Curncy"

  - id: cftc_risk_on_off
    hsbc_ref: 17
    name: "CFTC risk-on/off positioning"
    kind: derived
    availability_hsbc: public_cot
    frequency: weekly
    release_lag_days: 3
    compute: {op: mean_of_zscores, post: {op: diff, horizon: 3M}}
    sell: {rule: gt, pct: 90, window: expanding}
    buy: null
    status: PENDING_BQL
    source: bql
    bql:
      # One multi-security BQL request covers the whole basket.
      securities: ["ES1 Index", "GC1 Comdty", "TY1 Comdty", "JY1 Curncy", "AD1 Curncy"]
      report_type: cftc_legacy
      commitment_type: futures_and_options
      trader_type: non_commercial
      combine: mean_of_zscores
      # Sign convention: gold and JPY are risk-off, so their z-scores are
      # inverted before averaging, otherwise the composite cancels itself out.
      invert: ["GC1 Comdty", "JY1 Curncy", "TY1 Comdty"]
      normalise_by_open_interest: true
    series:
      - role: basket
        candidates: []
        pending: "diagnose_bql.py -> group cot_basket"
    notes: >
      HSBC does not disclose which contracts sit in their risk-on/risk-off
      basket. Equities, gold, ten-year Treasuries, yen and Aussie is a
      reasonable reading and covers both sides of the risk trade. The invert
      list matters and is an assumption worth surfacing in the UI.

  - id: cftc_equities
    hsbc_ref: 18
    name: "CFTC equity net positioning"
    kind: direct
    availability_hsbc: public_cot
    frequency: weekly
    release_lag_days: 3
    compute: {op: level}
    sell: {rule: gt, pct: 90, window: expanding}
    buy:  {rule: lt, pct: 10, window: expanding}
    status: PENDING_BQL
    # Not a ticker. Bloomberg exposes COT through the BQL function
    # cot_position(), behind //blp/bqlsvc rather than //blp/refdata. Every round
    # 1 ticker guess was doomed for that reason. Terminal function is COT <GO>.
    source: bql
    bql:
      security: "ES1 Index"
      report_type: cftc_legacy
      commitment_type: futures_and_options
      trader_type: non_commercial
      # Net = long minus short. Syntax confirmed by diagnose_bql.py rung 3.x.
      expression_template: |
        let(#long=cot_position(report_type=cftc_legacy,crop_year=all,
              trader_type=non_commercial,direction=long,
              commitment_type=futures_and_options,dates=range({start},{end}));
            #short=cot_position(report_type=cftc_legacy,crop_year=all,
              trader_type=non_commercial,direction=short,
              commitment_type=futures_and_options,dates=range({start},{end}));
            #net=#long-#short)
        get(#net) for('{security}')
      # Preferred form: scale by total open interest so the series is comparable
      # across twenty years of changing contract and market size.
      normalise_by_open_interest: true
    series:
      - role: primary
        candidates: []
        pending: "diagnose_bql.py -> groups cot_history, cot_normalise"

  - id: hsbc_equity_sentiment_proxy
    hsbc_ref: 19
    name: "Equity sentiment composite (HSBC proxy)"
    kind: proxy
    availability_hsbc: computable_proxy
    compute: {op: mean_of_zscores, post: {op: level}}
    sell: {rule: gt, pct: 90, window: {rolling_years: 3}}
    buy:  {rule: lt, pct: 10, window: {rolling_years: 3}}
    status: PARTIAL
    degraded_mode: three_leg   # survey + volatility + put_call, flows omitted
    series:
      - role: survey
        candidates: ["AAIIBULL Index", "AAII BULLISH Index"]  # both CONFIRMED, 1179 weekly obs
      - role: volatility
        candidates: ["VIX Index"]   # CONFIRMED, 5719 obs
      - role: flows
        optional: true
        candidates: []   # ROUND 1: ICIMMTOT and MMMFTOT both INVALID_TICKER
        pending: "sentiment_tickers_round2.yaml -> money_market_flow_hunt"
      - role: put_call
        candidates: ["PCRTEQTY Index", "PCUSEQTR Index"]   # both CONFIRMED
    notes: >
      HSBC states the ingredients (AAII + VIX + flows + put-call) but not the
      weights. Equal-weight z-scores assumed. Heavily redundant with inputs 12,
      20 and the CAPCA equity leg; the improved mode's clustering exists
      precisely to stop this double-counting.

  - id: average_survey_sentiment
    hsbc_ref: 20
    name: "Average survey sentiment"
    kind: derived
    availability_hsbc: mostly_public
    frequency: weekly
    release_lag_days: 0
    compute: {op: mean_of_zscores, post: {op: diff, horizon: 12M}}
    sell: {rule: gt, pct: 90, window: expanding}
    buy:  {rule: lt, pct: 10, window: expanding}
    series:
    status: PARTIAL
    degraded_mode: aaii_naaim_only
    series:
      - role: aaii_bull
        candidates: ["AAIIBULL Index"]   # CONFIRMED, 1179 weekly obs from 2004-01-01
      - role: aaii_bear
        candidates: ["AAIIBEAR Index"]   # CONFIRMED, 1179 weekly obs
      - role: investors_intelligence
        optional: true
        candidates: []   # ROUND 1: INBB, IIBULL, IISBULLS all INVALID_TICKER
        pending: "sentiment_tickers_round2.yaml -> investors_intelligence_hunt"
      - role: naaim
        candidates: ["NAAIMEXP Index"]   # CONFIRMED, 1046 weekly obs from 2006-07-05
    notes: >
      NAAIM resolved, which was the pleasant surprise here, so the survey leg
      has two of three sources and does not need a non-Bloomberg loader.
      Investors Intelligence is a paid Chartcraft feed and is unlikely to be
      recoverable. Note NAAIM starts in July 2006, two and a half years after
      AAII, so the composite's effective start is 2006-07-05 unless you weight
      by available legs at each date.

  - id: money_market_3m_flow
    hsbc_ref: 21
    name: "Money market fund 3-month flow"
    kind: derived
    availability_hsbc: public_ici
    frequency: weekly
    release_lag_days: 2
    compute:
      op: diff
      horizon: 3M
      smooth: {op: rolling_mean, months: 1}
    crisis_filter: ["2020"]
    sell: {rule: lt, pct: 10, window: {rolling_years: 5}}
    buy:  {rule: gt, pct: 90, window: {rolling_years: 5}}
    status: BLOCKED
    series:
      - role: primary
        candidates: []   # ROUND 1: all four INVALID_TICKER
        pending: "sentiment_tickers_round2.yaml -> money_market_flow_hunt"
    notes: >
      The only input whose cluster has no other members, so losing it removes
      the flows dimension entirely rather than merely thinning it. That makes it
      the highest-value of the three blocked inputs to recover. If round 2 also
      fails, ICI's free weekly money fund assets release or the Federal Reserve
      H.6 series are straightforward scheduled downloads, but adding a
      non-blpapi loader is an architectural decision worth taking deliberately
      given the provider-isolation rule and the corporate proxy.

# ---------------------------------------------------------------------------
# Correlation clusters used by the improved aggregation mode. Inputs inside a
# cluster share the cluster's weight rather than each counting once, which is
# the Tier-1 #3 de-duplication fix.
# ---------------------------------------------------------------------------
clusters:
  beta_exposure:   [cta_equity_beta, us_equity_fund_beta, us_multi_asset_fund_equity_beta]
  volatility:      [vix_curve, vix_hy_vix_ig, move, mask]
  options_flow:    [capca]
  positioning:     [cftc_equities, cftc_risk_on_off, equity_momentum_indicator, short_interest_equity_etfs, short_interest_equity_bond_etfs]
  surveys:         [average_survey_sentiment, hsbc_equity_sentiment_proxy]
  systematic_allocation: [risk_parity_equity_allocation, vol_target_equity_allocation]
  price_momentum:  [cross_asset_rsi, risk_appetite_pc1]
  flows:           [money_market_3m_flow]
  fx_beta:         [cta_usd_beta]
